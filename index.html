<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namonamaha Customer Care Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

:root{
  --ground:#FAF8F6; --surface:#FFFFFF; --surface-2:#F3F0ED; --surface-3:#EAE5E1;
  --ink:#1C1917; --ink-2:#57534E; --ink-3:#8A827C;
  --line:#E4DED8; --line-2:#D1C9C2;
  --accent:#9D2235; --accent-ink:#FFFFFF; --accent-soft:#FBEAED; --accent-line:#E8C4CB;
  --flow:#4338CA; --flow-soft:#EEEFFC; --flow-line:#C9CCF5;
  --ok:#15803D; --ok-soft:#E6F4EB; --ok-line:#BFE0CA;
  --warn:#B45309; --warn-soft:#FBF0E1; --warn-line:#EBD2A9;
  --stop:#B91C1C; --stop-soft:#FBEAEA; --stop-line:#EFC6C6;
  --info:#0369A1; --info-soft:#E6F1F8; --info-line:#BBD8EA;
  --r:10px; --r-sm:6px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:'Archivo','IBM Plex Sans',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(28,25,23,.05),0 4px 14px rgba(28,25,23,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#161413; --surface:#1F1D1B; --surface-2:#292524; --surface-3:#332F2D;
  --ink:#F5F1EE; --ink-2:#B8B0AA; --ink-3:#8A827C;
  --line:#332F2D; --line-2:#453F3C;
  --accent:#E8697F; --accent-ink:#2B0B12; --accent-soft:#33191E; --accent-line:#4E2831;
  --flow:#A5B4FC; --flow-soft:#1F2040; --flow-line:#383A6B;
  --ok:#4ADE80; --ok-soft:#15291D; --ok-line:#28492F;
  --warn:#FBBF24; --warn-soft:#2E2312; --warn-line:#4D3C15;
  --stop:#F87171; --stop-soft:#2E1616; --stop-line:#4D2424;
  --info:#7DD3FC; --info-soft:#12262E; --info-line:#1F4152;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#161413; --surface:#1F1D1B; --surface-2:#292524; --surface-3:#332F2D;
  --ink:#F5F1EE; --ink-2:#B8B0AA; --ink-3:#8A827C;
  --line:#332F2D; --line-2:#453F3C;
  --accent:#E8697F; --accent-ink:#2B0B12; --accent-soft:#33191E; --accent-line:#4E2831;
  --flow:#A5B4FC; --flow-soft:#1F2040; --flow-line:#383A6B;
  --ok:#4ADE80; --ok-soft:#15291D; --ok-line:#28492F;
  --warn:#FBBF24; --warn-soft:#2E2312; --warn-line:#4D3C15;
  --stop:#F87171; --stop-soft:#2E1616; --stop-line:#4D2424;
  --info:#7DD3FC; --info-soft:#12262E; --info-line:#1F4152;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- chrome ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:15px;padding:15px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap;
  background:none;border:none;padding:0;cursor:pointer}
.brand:hover .brand-logo{filter:brightness(1.1)}
.brand:hover .om-mark{filter:brightness(1.15) drop-shadow(0 0 6px rgba(157,34,53,.35))}
.om{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;flex:none}
.brand-logo{height:40px;width:auto;display:block}
.om-mark{font-family:var(--sans);font-weight:600;line-height:1;flex:none;
  background:linear-gradient(160deg,#F3B267,var(--accent) 55%,#7A1526);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(157,34,53,.35))}
.brand .om-mark{font-size:32px}
.dash-logo-img{height:30px;width:auto;flex:none}
.cc-user-badge{display:flex;align-items:center;gap:12px;margin-left:auto}
.cc-user-badge .who{font-size:15.5px;color:var(--ink-2);white-space:nowrap}
body.app-wallpaper{
  background-image:linear-gradient(180deg,rgba(8,6,15,.84),rgba(16,10,20,.88) 60%,rgba(8,6,15,.90)),url('wallpaper.jpg');
  background-position:center,center 22%;background-size:cover,cover;background-repeat:no-repeat,no-repeat;
  background-attachment:fixed,fixed}
body.app-wallpaper .top{background:rgba(20,16,28,.72);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.09)}
body.app-wallpaper .clock{color:#EDEAE6}
body.app-wallpaper .dash-side.wallpaper{background:rgba(14,11,22,.60);backdrop-filter:blur(6px);border-right:1px solid rgba(255,255,255,.08)}
body.app-wallpaper .dash-side.wallpaper .site-logo span{color:#F4EFE8}
body.app-wallpaper .dash-side.wallpaper .dl{color:#C9C2D8}
body.app-wallpaper .dash-side.wallpaper .dl[aria-current="true"]{background:rgba(255,255,255,.16);color:#FBD9A8}
body.app-wallpaper .dash-side.wallpaper .dl:hover{background:rgba(255,255,255,.10)}
/* non-CRM pages (devotee/agent/pandit) have no sidebar chrome of their own —
   float their content on a solid card over the wallpaper instead, so text stays
   legible in any theme without hand-tuning every heading's color */
body.app-wallpaper .wrap:not(:has(.dash)){
  background:var(--ground);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.4);
  margin-top:24px;margin-bottom:24px}
@media (max-width:760px){body.app-wallpaper{background-attachment:scroll,scroll}
  body.app-wallpaper .wrap:not(:has(.dash)){border-radius:0;margin:0;box-shadow:none}}
.care-login-wrap{position:relative;left:50%;width:100vw;margin-left:-50vw;box-sizing:border-box;
  min-height:calc(100vh - 140px);display:grid;place-items:center;padding:36px 16px;overflow:hidden;
  background:linear-gradient(180deg,#0A0918 0%,#161235 45%,#1E1A3E 100%)}
.care-login-wrap .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.care-login-wrap .nebula{position:absolute;inset:-10%;
  background:radial-gradient(ellipse 40% 30% at 18% 22%,rgba(147,112,219,.38),transparent 60%),
    radial-gradient(ellipse 35% 28% at 82% 18%,rgba(67,56,202,.32),transparent 60%),
    radial-gradient(ellipse 45% 32% at 55% 88%,rgba(157,34,53,.20),transparent 60%)}
.care-login-wrap .moon{position:absolute;top:9%;right:11%;width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#FDF6E3,#D9C9A3 55%,#8F7E5C 100%);
  box-shadow:0 0 55px 16px rgba(253,246,227,.30),0 0 110px 36px rgba(253,246,227,.10)}
.care-login-wrap .stars,.care-login-wrap .stars2{position:absolute;inset:-20px;
  background-image:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 82% 14%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 58% 68%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 32% 82%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 92% 78%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 16% 58%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 68% 36%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 46% 12%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 6% 42%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 74% 92%,#fff,transparent);
  background-size:260px 260px;background-repeat:repeat;opacity:.8;animation:twinkle 4.5s ease-in-out infinite}
.care-login-wrap .stars2{background-size:190px 190px;opacity:.5;animation-duration:3.2s;animation-delay:.8s}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.om-mark.lg{position:relative;z-index:1;display:block;text-align:center;font-size:56px;margin:0 0 6px;
  filter:drop-shadow(0 0 14px rgba(232,105,127,.35))}
.care-login-card{position:relative;z-index:1;width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);
  border-radius:calc(var(--r) + 4px);box-shadow:0 30px 80px rgba(0,0,0,.45);padding:52px 56px}
.care-login-logo{display:block;max-width:340px;width:100%;height:auto;margin:0 auto 10px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.12))}
.care-login-card .eyebrow{font-size:13px}
.care-login-card h1.h-page{font-size:32px;margin:6px 0 8px}
.care-login-card .sub{font-size:16px}
.care-login-card .fld{margin-bottom:18px}
.care-login-card label.f{font-size:15px;margin-bottom:7px}
.care-login-card .inp{font-size:18px;padding:15px 17px}
.care-login-card .pw-wrap .inp{padding-right:48px}
.care-login-card .pw-eye{width:38px;height:38px;right:4px}
.care-login-card .pw-eye svg{width:21px;height:21px}
.care-login-card .btn-wide{font-size:18px;padding:16px;margin-top:10px}
.care-login-card > .sub:last-child{font-size:14px;margin-top:22px}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:38px}
.pw-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;
  background:none;border:none;border-radius:var(--r-sm);color:var(--ink-3);cursor:pointer}
.pw-eye:hover{color:var(--ink-2);background:var(--surface-2)}
.pw-eye[aria-pressed="true"]{color:var(--accent)}
.tagpill{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--flow);background:var(--flow-soft);border:1px solid var(--flow-line);padding:4px 9px;border-radius:99px;white-space:nowrap}
.top-sp{flex:1 1 auto}
.clock{font-family:var(--mono);font-size:14px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:6px 11px;border-radius:var(--r-sm);white-space:nowrap}

.roles{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:thin}
.role{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);padding:10px 17px;border-radius:99px;cursor:pointer;font-weight:500;font-size:16px;white-space:nowrap}
.role:hover{border-color:var(--line-2);color:var(--ink)}
.role[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.role .dot{width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.55;flex:none}

.wrap{max-width:1160px;margin:0 auto;padding:22px 18px 96px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card+.card{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.roster-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.roster-row:last-child{border-bottom:0}
.roster-row>div{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,185px),1fr))}
.eyebrow{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:7px}
.h-page{font-size:31px;font-weight:700}
.h-sec{font-size:20px;font-weight:600}
.sub{color:var(--ink-2);font-size:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.crumb{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2);margin-bottom:15px;flex-wrap:wrap}
.crumb button{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:15px;text-decoration:underline;text-underline-offset:2px}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:12px 19px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:16.5px;text-align:center}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(1.08);background:var(--ok)}
:root[data-theme="dark"] .btn-ok,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ok{color:#0A1A0F}}
.btn-sm{padding:9px 14px;font-size:14.5px}
.btn-wide{width:100%}
.btn:focus-visible,.role:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--flow);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;padding:5px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.p-warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.p-stop{color:var(--stop);background:var(--stop-soft);border-color:var(--stop-line)}
.p-info{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.p-flow{color:var(--flow);background:var(--flow-soft);border-color:var(--flow-line)}
.p-mute{color:var(--ink-3);background:var(--surface-2);border-color:var(--line)}

label.f{display:block;font-size:15px;font-weight:500;color:var(--ink-2);margin-bottom:7px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;font-size:17px}
.inp:focus{border-color:var(--flow)}
.fld{margin-bottom:16px}

/* ---------- trigger annotation ---------- */
.trig{background:var(--flow-soft);border:1px solid var(--flow-line);border-left:3px solid var(--flow);border-radius:var(--r-sm);padding:16px 18px;margin:16px 0}
.trig h4{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--flow);margin-bottom:10px}
.trig ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.trig li{font-size:15.5px;color:var(--ink-2);line-height:1.55}
.trig li b{color:var(--ink);font-weight:600}
.trig .who{font-family:var(--mono);font-size:12.5px;color:var(--flow);background:var(--surface);border:1px solid var(--flow-line);padding:1px 6px;border-radius:4px;white-space:nowrap}

.warnbox{background:var(--warn-soft);border:1px solid var(--warn-line);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:16px 18px;margin:16px 0}
.warnbox h4{font-size:16.5px;font-weight:600;color:var(--warn);margin-bottom:7px;font-family:var(--sans)}
.warnbox p{margin:0;font-size:15.5px;color:var(--ink-2)}
.okbox{background:var(--ok-soft);border:1px solid var(--ok-line);border-left:3px solid var(--ok);border-radius:var(--r-sm);padding:16px 18px;margin:16px 0}
.okbox h4{font-size:16.5px;font-weight:600;color:var(--ok);margin-bottom:7px;font-family:var(--sans)}
.okbox p{margin:0;font-size:15.5px;color:var(--ink-2)}
.stopbox{background:var(--stop-soft);border:1px solid var(--stop-line);border-left:3px solid var(--stop);border-radius:var(--r-sm);padding:16px 18px;margin:16px 0}
.stopbox h4{font-size:16.5px;font-weight:600;color:var(--stop);margin-bottom:7px;font-family:var(--sans)}
.stopbox p{margin:0;font-size:15.5px;color:var(--ink-2)}

/* ---------- list rows ---------- */
.lrow{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;text-align:left;width:100%}
.lrow:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.lrow-main{flex:1 1 auto;min-width:0}
.lrow-t{font-weight:600;font-size:17.5px;margin-bottom:4px}
.lrow-s{font-size:15px;color:var(--ink-2)}
.lrow-r{flex:none;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cc-booking-row{cursor:default}
.cc-name-link,.text-link{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cc-name-link{font-size:17.5px;text-decoration:none}
.cc-name-link:hover,.text-link:hover{text-decoration:underline}
.running-dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft),0 0 12px var(--ok);animation:running-pulse 1.6s ease-in-out infinite;vertical-align:middle}
@keyframes running-pulse{50%{box-shadow:0 0 0 6px var(--ok-soft),0 0 18px var(--ok);opacity:.75}}
.countdown{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap}
.countdown.far{background:var(--info-soft);color:var(--info);border:1px solid var(--info-line)}
.countdown.soon{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.countdown.today{background:var(--stop-soft);color:var(--stop);border:1px solid var(--stop-line)}
.countdown.running{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.countdown.done{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.care-modal{position:fixed;inset:0;z-index:75;display:grid;place-items:center;padding:16px}
.care-modal-backdrop{position:absolute;inset:0;background:rgba(15,12,10,.62);backdrop-filter:blur(3px)}
.care-modal-panel{position:relative;width:min(100%,1080px);max-height:min(92vh,940px);display:flex;flex-direction:column;background:var(--ground);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.28);overflow:hidden}
.care-modal-panel.edit{width:min(100%,840px)}
.care-modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:16px}
.care-modal-content{padding:24px;overflow-y:auto;min-height:0}
body.modal-open{overflow:hidden}
@media (max-width:560px){.care-modal{padding:0}.care-modal-panel{width:100%;height:100%;max-height:100%;border-radius:0}.care-modal-content{padding:14px}}
.aa-panel{position:fixed;right:18px;bottom:18px;z-index:70;width:min(400px,calc(100vw - 36px));max-height:min(74vh,640px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 48px rgba(0,0,0,.22)}
.aa-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.aa-head h4{font-family:var(--disp);font-size:16px;margin:0 0 3px}
.aa-controls{display:flex;gap:5px;flex-shrink:0}
.aa-icon-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer;font-size:12px;line-height:1;padding:0}
.aa-icon-btn:hover{background:var(--surface-3)}
.aa-progress{height:3px;background:var(--surface-3)}
.aa-bar{height:100%;background:var(--flow);transition:width .3s ease}
.aa-status{padding:9px 14px 0;font-size:14px;color:var(--ink-2)}
.aa-list{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.aa-row{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:var(--ground);animation:aa-enter .25s ease;font-size:14px}
.aa-row.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.aa-row.pending{align-items:center;color:var(--ink-3);font-size:14px}

    </div>
    <div class="drawer-l" id="evlist"></div>
  </div>
</div>

<script>
/* ==========================================================================
   NAMONAMAHA — operating prototype
   Layers: CONFIG -> DATA -> STORE -> UI -> SCREENS -> ROUTER
   Everything a screen renders comes from CONFIG or STORE. To add a feature,
   add to CONFIG and register a screen; no existing branch needs editing.
   All payments simulated. All phone numbers fictional.
   ========================================================================== */
const HOUR=3600000, DAY=86400000, MIN=60000;
const INR = n => '₹' + Number(Math.round(n)).toLocaleString('en-IN');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- roles ---------------- */
const ROLES={
  devotee:{label:'Devotee',surface:'Public website + booking dashboard',auth:'Supabase phone OTP'},
  care:   {label:'Customer care',surface:'CRM',auth:'Supabase email + role claim'},
  agent:  {label:'Onsite agent',surface:'Mobile dashboard',auth:'Supabase phone OTP + role claim'},

/* Customer care is temple-wise: a CC login (or an admin opening a temple's portal) only
   works the bookings of that one temple. No temple on the login = sees every temple. */
function ccTempleId(){
  if(S.role!=='cc') return null;
  const u=S.careUser?careUser(S.careUser):null;
  return (u&&u.templeId)||null;
}
const loginTaken=(id,exceptUser,exceptAdmin)=>{ const k=String(id).trim().toLowerCase();
  return CARE_USERS.some(x=>x.id!==exceptUser&&x.loginId.toLowerCase()===k)||ADMIN_USERS.some(x=>x.id!==exceptAdmin&&x.loginId.toLowerCase()===k); };
const adminState=()=>{ const a=S.adminUser?adminUser(S.adminUser):null; return a?a.state:null; };
const templesInZone=()=>{ const st=adminState(); return st?TEMPLES.filter(t=>t.state===st):TEMPLES; };
function scopeBk(list){ const t=ccTempleId(); return t?list.filter(b=>b.templeId===t):list; }

const fmtDate=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
const fmtDT  =ts=>fmtDate(ts)+', '+fmtTime(ts);
const dstr   =ts=>new Date(ts).toISOString().slice(0,10);
function rel(ts){const d=ts-SIM;const h=Math.round(Math.abs(d)/HOUR);
  const s=h<24?h+'h':Math.round(Math.abs(d)/DAY)+'d';return d<0?s+' ago':'in '+s;}
function mask(p){return String(p).replace(/(\+91 \d{2})\d{3} \d{2}(\d{3})/,'$1••• ••$2');}
/* Devotee PII masking for customer care — keeps the first few characters/digits so a
   handler can still recognise a repeat caller, but never sees enough to reuse the data
   outside the platform. See PERMS['booking.devotee.name'/'phone'] care:'masked'. */
function maskCred(v){ return String(v||'').slice(0,2)+'*****'; }
function maskName(name){
  return String(name||'').split(' ').filter(Boolean).map(w=>w.length<=3?w:w.slice(0,3)+'****').join(' ')||'—';
}
function maskPhoneDisplay(phone){
  const s=String(phone||''); if(!s) return '—';
  const m=s.match(/^(\+\d{1,3}\s?)(.*)$/);
  const cc=m?m[1]:'', digits=(m?m[2]:s).replace(/\D/g,'');
  return (cc+digits.slice(0,4)+'*****').trim();
}
const isCareMasked=()=>S.role==='cc';
function devDisplayName(b){ return isCareMasked()?maskName(b.devotee.name):b.devotee.name; }
function devDisplayPhone(b){ return isCareMasked()?maskPhoneDisplay(b.devotee.phone):b.devotee.phone; }
const newOtp=()=>String(Math.floor(1000+Math.random()*9000));
const newArrival=()=>'NM'+String(Math.floor(10+Math.random()*89));

/* ---- permissions ---- */
function can(role,path){
  const r=PERMS[path]||PERMS['catalogue.*'];
  return (role==='admin')?'edit':(r[role]||'hide');
}
const permWhy=path=>(PERMS[path]||{}).why||'';

/* ---- payout maths ---- */
function payoutLines(p,amount){
  return (p.payout||[]).map(x=>({
    payee:x.p,label:PAYEE_LABEL[x.p]||x.p,basis:x.b,value:x.v,
    amount: x.b==='percent' ? Math.round(amount*x.v/100) : x.v
  }));
}

/* ---- availability ---- */
function blackoutOn(templeId,ts){
  const d=dstr(ts);
  return BLACKOUTS.find(b=>b.templeId===templeId&&b.blocks&&d>=b.from&&d<=b.to)||null;
}
function templeOpenAt(templeId,ts){
  const d=new Date(ts), minute=d.getHours()*60+d.getMinutes();
  return (TEMPLE_WINDOWS[templeId]||[[0,1440]]).some(([start,end])=>minute>=start&&minute<end);
}
function agentAvailability(b,a,ts){
  if(!a) return {free:false,reason:'Agent not found'};
  if(!a.temples.includes(b.templeId)) return {free:false,reason:'Does not cover this temple'};
  if(!a.active) return {free:false,reason:a.shift.startsWith('On leave')?a.shift:'Off duty'};
  const match=a.shift.match(/(\d{1,2}):(\d{2}) (AM|PM) – (\d{1,2}):(\d{2}) (AM|PM)/);
  if(match){
    const mins=(h,m,ap)=>(Number(h)%12+(ap==='PM'?12:0))*60+Number(m);
    const time=new Date(ts).getHours()*60+new Date(ts).getMinutes();
    if(time<mins(match[1],match[2],match[3])||time>=mins(match[4],match[5],match[6]))
      return {free:false,reason:'Outside shift · '+a.shift};
  }
  const clash=DB.bookings.find(x=>x.id!==b.id&&x.agentId===a.id&&x.status!=='CANCELLED'&&
    x.status!=='COMPLETED'&&x.status!=='SETTLED'&&Math.abs(x.pujaAt-ts)<2*HOUR);
  return clash?{free:false,reason:'Booked for '+clash.id+' at '+fmtTime(clash.pujaAt)}:{free:true,reason:'Available · '+a.shift};
}
const runningBookingsForAgent=(agentId,templeId)=>DB.bookings.filter(b=>b.agentId===agentId&&
  (!templeId||b.templeId===templeId)&&!['CANCELLED','COMPLETED','SETTLED'].includes(b.status));
const runningBookingsForPandit=(panditId)=>DB.bookings.filter(b=>b.pandaId===panditId&&
  !['CANCELLED','COMPLETED','SETTLED'].includes(b.status));
const whatsappUrl=(phone,text)=>'https://wa.me/'+String(phone).replace(/\D/g,'')+(text?'?text='+encodeURIComponent(text):'');
const agentNameId=id=>id?esc(agent(id).name)+' <span class="mono sub">('+esc(id)+')</span>':'Not assigned';
const panditNameId=id=>id?esc(pandit(id).name)+' <span class="mono sub">('+esc(id)+')</span>':'Not assigned';
function agentRoster(b,ts,interactive=true){
  const members=AGENTS.filter(a=>a.temples.includes(b.templeId));
  return members.map(a=>{
    const status=agentAvailability(b,a,ts);

    return '<div class="roster-row"><div>'+(interactive?'<button class="text-link" data-act="cc-agent-view" data-v="'+a.id+'" data-temple="'+b.templeId+'" data-id="'+b.id+'">'+esc(a.name)+'</button>':'<b>'+esc(a.name)+'</b>')+' <span class="mono sub">'+esc(a.id)+'</span>'+
      '<div class="sub">'+esc(a.phone)+' · '+esc(status.reason)+' · '+count+' pandit'+(count===1?'':'s')+' in this team · '+work.length+' active here · '+assigned+' with pandit</div></div>'+
      '<div class="row"><span class="workload-badge">'+total.length+' active pooja'+(total.length===1?'':'s')+'</span>'+
      '<span class="pill '+(status.free?'p-ok':'p-stop')+'">'+(status.free?'Available':'Unavailable')+'</span></div></div>';
  }).join('')||'<div class="sub">No agents cover this temple yet.</div>';
}
function agentOptions(b,ts,selectedId=b.agentId,preserveId=null){
  return '<option value="">— choose —</option>'+AGENTS.filter(a=>a.temples.includes(b.templeId)).map(a=>{
    const st=agentAvailability(b,a,ts);

function panditsFor(b,agentId){
  const day=dstr(b.pujaAt);
  return PANDITS.filter(d=>d.temple===b.templeId&&(!agentId||(d.agentIds||[]).includes(agentId))).map(d=>{
    const booked=DB.bookings.filter(x=>x.pandaId===d.id&&x.id!==b.id&&dstr(x.pujaAt)===day&&x.status!=='CANCELLED').length;
    const clash=DB.bookings.some(x=>x.pandaId===d.id&&x.id!==b.id&&x.status!=='CANCELLED'&&Math.abs(x.pujaAt-b.pujaAt)<90*MIN);
    const onLeave=d.leave.includes('absent-today')&&day===dstr(SIM);
    return {d,booked,clash,onLeave,free:d.active&&!clash&&!onLeave&&booked<d.cap};
  });
}

function slaState(b){

const ACTOR={devotee:'Devotee',care:'Customer care — Priya',agent:'Agent — Pintu Sarma',
 pandit:'Pandit — Dhiren Sarma',accounts:'Accounts — Nibedita',admin:'Admin — you',system:'System'};
function audit(b,field,label,oldV,newV,role,reason){
  b.audit.unshift({at:SIM,field,label,old:oldV,new:newV,by:ACTOR[role]||role,role,reason:reason||''});
}
function setField(b,path,label,newV,role,fmt,reason){
  const parts=path.split('.'); let o=b;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  const key=parts[parts.length-1], oldV=o[key];
  if(String(oldV)===String(newV)) return false;
  o[key]=newV;
  const f=fmt||(x=>x===''||x==null?'—':String(x));
  audit(b,path,label,f(oldV),f(newV),role,reason);
  return true;
}

/* ---- auto-assign agent (bulk) ---- */
const autoAssignEligible=()=>scopeBk(DB.bookings).filter(b=>b.balancePaid&&!b.agentId&&b.status!=='CANCELLED'&&MODES[b.mode].needsAgent);
function autoAssignOne(b,role){
  const covering=AGENTS.filter(a=>a.temples.includes(b.templeId));
  const available=covering.filter(a=>agentAvailability(b,a,b.pujaAt).free);
  if(!available.length) return {bookingId:b.id,ok:false,reason:'No agent at '+temple(b.templeId).name+' is available for this pooja time.'};
  const withPandit=available.filter(a=>panditsFor(b,a.id).some(x=>x.free));
  const pool=(withPandit.length?withPandit:available).slice()
    .sort((x,y)=>runningBookingsForAgent(x.id).length-runningBookingsForAgent(y.id).length);
  const chosen=pool[0];
  if(!assignAgent(b,chosen.id,role||'care')) return {bookingId:b.id,ok:false,reason:'The best-matched agent became unavailable. Choose one manually.'};
  return {bookingId:b.id,ok:true,agentId:chosen.id,panditFree:withPandit.includes(chosen)};
}
function startAutoAssign(){
  if(S.autoAssign&&!S.autoAssign.done){ S.autoAssign.minimized=false; render(); return; }
  const targets=autoAssignEligible();
  if(!targets.length){ toast('Every fully paid booking already has an onsite agent.'); return; }
  S.autoAssign={queue:targets.map(b=>b.id),results:[],minimized:false,done:false};
  render();
  window.setTimeout(autoAssignStep,300);
}
function autoAssignStep(){
  const st=S.autoAssign; if(!st||st.done) return;
  const nextId=st.queue[st.results.length];
  if(!nextId){ st.done=true; render(); return; }
  const b=bk(nextId);
  st.results.push(b?autoAssignOne(b,'care'):{bookingId:nextId,ok:false,reason:'Booking no longer exists.'});
  render();
  if(st.results.length<st.queue.length) window.setTimeout(autoAssignStep,650);
  else{ st.done=true; render(); }
}
function autoAssignPanel(){
  const st=S.autoAssign; if(!st) return '';
  const total=st.queue.length, done=st.results.length;
  if(st.minimized){
    return '<div class="aa-mini" role="status" aria-label="Auto assign agent, minimised">'+
      '<button class="aa-icon-btn" data-act="cc-auto-assign-toggle" aria-label="Expand auto-assign panel" title="Expand">▸</button>'+

function applyCareEdit(b,input){
  if(!b||['CANCELLED','COMPLETED','SETTLED'].includes(b.status)||isPujaRunning(b))
    return {error:'A running or closed pooja cannot be edited.'};
  const t=temple(input.templeId), p=puja(input.pujaId), reason=String(input.reason||'').trim();
  if(!reason) return {error:'Add a reason for this customer request.'};
  if(!t||!p||p.templeId!==t.id||(!p.active&&p.id!==b.pujaId)) return {error:'Choose an active pooja at the selected temple.'};
  if(!t.live&&t.id!==b.templeId) return {error:'The selected temple is not accepting bookings yet.'};
  if(!Number.isFinite(input.pujaAt)) return {error:'Choose a valid pooja date and time.'};
  const scheduleChanged=input.pujaAt!==b.pujaAt||t.id!==b.templeId||p.id!==b.pujaId;
  if(scheduleChanged&&input.pujaAt<SIM+p.lead*DAY) return {error:'This pooja needs at least '+p.lead+' days of lead time.'};
  const blackout=blackoutOn(t.id,input.pujaAt);
  if(blackout) return {error:'Temple closed on that date: '+blackout.reason};
  if(!templeOpenAt(t.id,input.pujaAt)) return {error:'Choose a time within '+t.name+' hours: '+t.hours};
  const needsAgent=MODES[p.mode].needsAgent;
  const agentId=needsAgent?(input.agentId||null):null;
  const proposed=Object.assign({},b,{templeId:t.id,pujaId:p.id,mode:p.mode,pujaAt:input.pujaAt});
  if(needsAgent&&b.ccConfirmed&&!agentId&&scheduleChanged) return {error:'Choose an available agent for this temple and time.'};
  if(agentId&&(scheduleChanged||agentId!==b.agentId)&&!agentAvailability(proposed,agent(agentId),input.pujaAt).free)
    return {error:'The selected agent is unavailable for this temple and time.'};
  const previous={templeId:b.templeId,pujaId:b.pujaId,pujaAt:b.pujaAt,agentId:b.agentId,amount:b.amount,status:b.status};
  let changed=false;
  changed=setField(b,'templeId','Temple',t.id,'care',x=>temple(x).name,reason)||changed;
  changed=setField(b,'pujaId','Pooja / package',p.id,'care',x=>puja(x).name,reason)||changed;
  changed=setField(b,'mode','Service mode',p.mode,'care',x=>MODES[x].label,reason)||changed;
  if(input.pujaAt!==b.pujaAt){reschedule(b,input.pujaAt,'care',reason);changed=true;}
  changed=setField(b,'devotee.city','Client location',String(input.city||'').trim(),'care',null,reason)||changed;
  changed=setField(b,'devotee.email','Email',String(input.email||'').trim(),'care',null,reason)||changed;
  changed=setField(b,'devotee.wish','Pooja details / wish',String(input.wish||'').trim(),'care',null,reason)||changed;
  changed=setField(b,'language','Message language',input.language||b.language,'care',null,reason)||changed;
  if(agentId!==b.agentId){
    if(agentId){
      const assigned=b.escalated?reassignAgent(b,agentId,'care'):assignAgent(b,agentId,'care');
      if(!assigned) return {error:'The selected agent became unavailable. Please choose another.'};
    }else{
      setField(b,'agentId','Onsite agent',null,'care',x=>x?agent(x).name:'—',reason);
    }
    changed=true;
  }
  if(b.pandaId){
    const stillFree=panditsFor(b,b.agentId||null).some(x=>x.d.id===b.pandaId&&x.free);
    if(t.id!==previous.templeId||p.id!==previous.pujaId||!stillFree){
      audit(b,'pandaId','Pandit',pandit(b.pandaId).name,'—','care','Assignment reopened after booking edit');
      b.pandaId=null;changed=true;
      tlAdd(b,'Pandit assignment reopened','Temple, package, agent or time changed');
    }
  }
  if(p.id!==previous.pujaId){
    changed=setField(b,'amount','Package price',p.price,'care',INR,reason)||changed;
    const captured=b.payments.filter(x=>x.status==='captured'&&x.amount>0).reduce((sum,x)=>sum+x.amount,0);
    const priorAdvance=b.advanceAmt,priorBalance=b.balanceAmt,priorCredit=b.creditDue||0;
    if(b.advancePaid){
      b.advanceAmt=b.payments.filter(x=>x.kind==='advance'&&x.status==='captured').reduce((sum,x)=>sum+x.amount,0);
      b.balanceAmt=Math.max(0,p.price-captured);
      b.creditDue=Math.max(0,captured-p.price);
      b.balancePaid=captured>=p.price;
      if(!b.balancePaid) b.linkSent=false;
    }else{
      b.advanceAmt=Math.round(p.price*b.advancePct/100);
      b.balanceAmt=p.price-b.advanceAmt;
    }
    if(b.advanceAmt!==priorAdvance) audit(b,'advanceAmt','Advance amount',INR(priorAdvance),INR(b.advanceAmt),'care',reason);
    if(b.balanceAmt!==priorBalance) audit(b,'balanceAmt','Current balance due',INR(priorBalance),INR(b.balanceAmt),'care',reason);
    if((b.creditDue||0)!==priorCredit) audit(b,'creditDue','Credit to review',INR(priorCredit),INR(b.creditDue||0),'care',reason);
    if(b.invoice) b.invoiceNeedsRevision=true;
    if(b.creditDue) ev('System','Credit review needed — '+b.id,INR(b.creditDue)+' was paid above the revised package price. Accounts must review the refund.',b.id);
  }
  if(scheduleChanged||agentId!==previous.agentId){
    if(b.pandaId&&b.balancePaid) b.status='PANDIT_ASSIGNED';
    else if(b.balancePaid&&b.ccConfirmed) b.status='FULLY_PAID';
    else if(b.ccConfirmed) b.status=b.linkSent?'LINK_SENT':'CC_CONFIRMED';
    else if(b.advancePaid) b.status='ADVANCE_PAID';
    if(b.status!==previous.status) audit(b,'status','Status',previous.status,b.status,'care',reason);
  }
  if(scheduleChanged&&b.otpIssued&&!b.otpVerified&&b.pujaAt>SIM+48*HOUR){
    b.otpIssued=false;b.otp=newOtp();
    audit(b,'otpIssued','Completion code','Issued','Rescheduled for T-48h','care',reason);
  }
  if(changed){
    tlAdd(b,'Booking changed by customer care',reason);
    ev('WhatsApp','Booking details updated — '+b.id,'Client '+b.clientId+' · pooja '+b.poojaBookingId+' · '+p.name+' at '+t.name+' on '+fmtDT(b.pujaAt)+'. Reason: '+reason,b.id);
    tick();
  }
  return {ok:true,changed,packageChanged:p.id!==previous.pujaId,creditDue:b.creditDue||0,
    balanceDue:Math.max(0,b.amount-b.payments.filter(x=>x.status==='captured'&&x.amount>0).reduce((sum,x)=>sum+x.amount,0))};
}

function tick(){
  DB.bookings.forEach(b=>{
    if(b.status==='SETTLED'||b.status==='CANCELLED') return;
    maybeIssueOtp(b);
    b.reminders.forEach(r=>{
      if(r.sent||r.skipped) return;
      const due=b.pujaAt-r.h*HOUR;
      if(SIM>=due&&SIM<=b.pujaAt+HOUR){
        const h=new Date(due).getHours();
        const shifted=(h>=QUIET.from||h<QUIET.to);
        r.sent=true; r.sentAt=SIM; if(shifted) r.skip='shifted out of quiet hours';
        ev(r.ch.split(' ')[0],'Reminder '+r.k+' — '+b.id,r.label+' · '+r.ch+(shifted?' · held to 8 AM (quiet hours)':''),b.id,r.tpl);
      }
    });
    if(b.balancePaid&&!b.pandaId&&!b.escalated&&MODES[b.mode].needsAgent&&SIM>=b.pujaAt-24*HOUR&&!b._nudged){
      b._nudged=true;
      ev('Push','Pandit assignment due — '+b.id,'Inside the 24-hour window. '+(agent(b.agentId)||{name:'No agent'}).name+' must assign a pandit or bypass to care.',b.id);
    }
  });
  DB.events.sort((a,c)=>c.at-a.at);
}

function devoteeStatus(b){
  if(isPujaRunning(b)) return 'running';
  if(b.status==='CANCELLED') return 'cancelled';

  if(b.balancePaid) return 'ready';

}

function filteredDevotees(from,to){
  const f=S.devFilter;
  return scopeBk(DB.bookings).filter(b=>{
    if(f.type!=='all'&&b.mode!==f.type) return false;
    if(f.pay!=='all'&&devoteeStatus(b)!==f.pay) return false;
    if(from&&dstr(b.pujaAt)<from) return false;
    if(to&&dstr(b.pujaAt)>to) return false;
    if(f.letter&&!b.devotee.name.toUpperCase().startsWith(f.letter)) return false;
    if(f.q){
      const q=f.q.toLowerCase();
      if(!(b.devotee.name.toLowerCase().includes(q)||b.devotee.phone.toLowerCase().includes(q)||
           b.id.toLowerCase().includes(q)||b.clientId.toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a,c)=>a.pujaAt-c.pujaAt);
}

function downloadDevoteesCsv(){
  const f=S.devFilter;
  const from=f.expFrom||f.from, to=f.expTo||f.to;
  const list=filteredDevotees(from,to);
  if(!list.length){ toast('No devotees match the export range and filters.','stop'); return; }
  const blob=new Blob([devoteesCsv(list)],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='namonamaha-devotees-'+(from||'all')+'_to_'+(to||dstr(SIM))+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(list.length+' booking'+(list.length===1?'':'s')+' exported'+(from||to?' for '+(from||'the start')+' – '+(to||'today'):'')+'.');
}
function remainingBadge(b){
  if(isPujaRunning(b)) return '<span class="countdown running">Pooja running</span>';
  if(['COMPLETED','SETTLED'].includes(b.status)) return '<span class="countdown done">Completed</span>';
  if(b.status==='CANCELLED') return '<span class="countdown done">Cancelled</span>';
  const left=b.pujaAt-SIM;
  if(left<=0) return '<span class="countdown today">Pooja time reached</span>';
  if(left>=DAY){const days=Math.ceil(left/DAY);return '<span class="countdown '+(days<=2?'soon':'far')+'">'+days+' day'+(days===1?'':'s')+' remaining</span>';}
  const hours=Math.ceil(left/HOUR);
  return '<span class="countdown today">'+hours+' hour'+(hours===1?'':'s')+' remaining</span>';
}

function ccQueue(){
  const A=scopeBk(DB.bookings);
  const used=new Set();
  const pick=predicate=>{const rows=A.filter(b=>!used.has(b.id)&&predicate(b));rows.forEach(b=>used.add(b.id));return rows;};
  const running=pick(isPujaRunning);
  const esc_=pick(b=>b.escalated);
  const needCall=pick(b=>b.advancePaid&&!b.ccConfirmed&&b.status!=='CANCELLED');
  const needLink=pick(b=>b.ccConfirmed&&!b.linkSent&&b.status!=='CANCELLED');
  const unpaid=pick(b=>b.linkSent&&!b.balancePaid&&b.status!=='CANCELLED');
  const media=pick(b=>b.otpVerified&&!b.photos.length);
  const rest=A.filter(b=>!used.has(b.id));
  const sec=(t,l,n,tone)=>!l.length?'':'<h3 class="h-sec" style="margin:20px 0 4px">'+esc(t)+' <span class="pill '+(tone||'p-mute')+'">'+l.length+'</span></h3>'+
    '<p class="sub" style="margin:0 0 10px">'+esc(n)+'</p><div class="stack">'+l.map(ccRow).join('')+'</div>';
  const noAgent=autoAssignEligible();
  return '<div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">'+
   '<div><div class="eyebrow">Customer care · '+esc(ccScopeLabel())+'</div><h1 class="h-page">Work queue</h1></div>'+
   '<button class="btn btn-pri" data-act="cc-auto-assign-start"'+(noAgent.length?'':' disabled')+'>Auto assign agent'+
   (noAgent.length?' <span class="pill p-mute" style="margin-left:6px;vertical-align:middle">'+noAgent.length+'</span>':'')+'</button></div>'+
   '<div class="grid g4" style="margin-top:12px">'+
   [['Total client bookings',A.length,'p-info'],['Running now',running.length,'p-ok'],['Escalations',esc_.length,'p-stop'],['Needs a call',needCall.length,'p-warn'],
    ['Needs balance link',needLink.length,'p-warn'],['Balance outstanding',unpaid.length,'p-warn'],
    ['Fully paid, no agent',noAgent.length,'p-warn']].map(([l,n,c])=>
    '<div class="card"><div class="eyebrow">'+esc(l)+'</div><div class="mono" style="font-size:34px;font-weight:600">'+n+'</div>'+
    (n?'<span class="pill '+c+'" style="margin-top:8px">action needed</span>':'<span class="pill p-ok" style="margin-top:8px">clear</span>')+'</div>').join('')+'</div>'+
   trig(['Every booking arrives the moment the advance clears, whether from the website or from the '+who('AI voice agent')+'.',
         'Ordered by what is <b>blocking</b> each booking, not by date. A care agent should never have to decide what to work on.',
         'Rows turn red on SLA breach: 4 hours to the first call, 1 hour to send the balance link.',
         'Live through Supabase Realtime — an escalation raised by '+who('Agent')+' appears here without a refresh.'])+
   sec('Poojas running now',running,'Started by the pandit or agent. The green dot stays on until the completion code is verified.','p-ok')+
   sec('Escalated — handle first',esc_,'The onsite agent could not assign a pandit. Reassign to another agent.','p-stop')+
   sec('Awaiting the confirmation call',needCall,'Advance is paid. Call within 4 hours, confirm everything, assign an agent.','p-warn')+
   sec('Confirmed — send the balance link',needLink,'The call is done. Send the link from the booking page.','p-warn')+
   sec('Balance outstanding',unpaid,'Link is out. Follow up as the date approaches.','p-warn')+
   sec('Photographs pending',media,'Puja is done but the agent has not uploaded media. Devotee is waiting.','p-warn')+
   sec('In progress and closed',rest,'No action pending from customer care.','p-mute');
}

function adPayments(){
  const done=DB.bookings.filter(b=>b.otpVerified);
  const pend=done.filter(b=>!b.settled);
  return '<h1 class="h-page">Payments & settlement</h1>'+
   trig(['Money in is automatic — the Razorpay webhook reconciles every advance and balance against its booking.',
         '<b>Money out is manual for now.</b> The payout happens outside the system and is recorded here, so each booking still carries a complete financial record.',
         'The amounts are pre-filled from the puja’s payout rules, so accounts never retypes a number.',
         'Only a puja closed with a verified completion code becomes eligible for settlement.',
         'Weekly batches group several bookings into one payout per pandit, which is how this should be paid in practice.'])+
   (pend.length?'<h3 class="h-sec" style="margin:20px 0 10px">Awaiting settlement <span class="pill p-warn">'+pend.length+'</span></h3>'+
    '<div class="stack">'+pend.map(b=>{
      const p=puja(b.pujaId), lines=payoutLines(p,b.amount);
      return '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">'+
       '<div><div class="lrow-t">'+esc(b.devotee.name)+' · <span class="mono" style="font-weight:400">'+b.id+'</span></div>'+
       '<div class="lrow-s">'+esc(p.name)+' · performed '+fmtDate(b.pujaAt)+' · closed by '+esc(b.otpBy||'—')+'</div></div>'+
       '<span class="mono" style="font-weight:600">'+INR(b.amount)+' in</span></div>'+
       '<hr class="sep"><div class="eyebrow">Recorded payout · pre-filled from the payout rules</div>'+
       '<div class="grid g4">'+lines.map((l,i)=>
        '<div><label class="f">'+esc(l.label)+'<span class="sub"> ('+(l.basis==='percent'?l.value+'%':'fixed')+')</span></label>'+
        '<input class="inp mono" id="st-'+b.id+'-'+i+'" value="'+l.amount+'"></div>').join('')+'</div>'+
       '<div class="row" style="margin-top:12px;justify-content:space-between">'+
       '<button class="btn btn-pri" data-act="ad-settle" data-id="'+b.id+'">Record settlement</button>'+
       '<span class="sub">Margin on this booking: <span class="mono">'+INR(margin(p,b.amount))+'</span></span></div></div>';
    }).join('')+'</div>'
    :'<div class="okbox" style="margin-top:14px"><h4>Nothing awaiting settlement</h4><p>Every completed puja has been paid out and recorded.</p></div>')+
   '<h3 class="h-sec" style="margin:24px 0 10px">Payment ledger</h3>'+
   '<div class="card" style="padding:6px"><div class="scroll-x"><table class="t"><thead><tr>'+
   '<th>Booking</th><th>Invoice</th><th>Value</th><th>Advance</th><th>Balance</th><th>Paid out</th><th>Margin</th><th>Reference</th></tr></thead><tbody>'+
   DB.bookings.map(b=>{const s=b.settlement;
     return '<tr><td class="mono">'+b.id+'</td><td class="mono sub">'+(b.invoice?esc(b.invoice.number):'—')+'</td>'+
      '<td class="mono">'+INR(b.amount)+'</td>'+
      '<td>'+(b.advancePaid?'<span class="pill p-ok">'+INR(b.advanceAmt)+'</span>':'<span class="pill p-mute">due</span>')+'</td>'+
      '<td>'+(b.balancePaid?'<span class="pill p-ok">'+INR(b.balanceAmt)+'</span>':(b.linkSent?'<span class="pill p-warn">link sent</span>':'<span class="pill p-mute">not requested</span>'))+'</td>'+
      '<td class="mono">'+(s?INR(s.total):'—')+'</td>'+
      '<td class="mono">'+(s?INR(b.amount-s.total):'—')+'</td>'+
      '<td class="mono sub">'+(s?esc(s.ref):'—')+'</td></tr>';
   }).join('')+'</tbody></table></div></div>'+
   '<div class="card"><div class="eyebrow">Weekly payout batches</div>'+
   '<p class="sub" style="margin:0 0 10px">In practice a pandit is paid once a week, not once per booking. A batch groups every settled line for one payee across a period into a single transfer with one reference.</p>'+
   '<div class="scroll-x"><table class="t"><thead><tr><th>Payee</th><th>Settled lines</th><th style="text-align:right">Total</th></tr></thead><tbody>'+
   (function(){const m={};DB.bookings.filter(b=>b.settlement).forEach(b=>b.settlement.lines.forEach(l=>{
     m[l.label]=m[l.label]||{n:0,t:0};m[l.label].n++;m[l.label].t+=l.amount;}));
     const ks=Object.keys(m);
     return ks.length?ks.map(k=>'<tr><td>'+esc(k)+'</td><td class="mono">'+m[k].n+'</td><td class="mono" style="text-align:right">'+INR(m[k].t)+'</td></tr>').join('')
       :'<tr><td colspan="3" class="sub">Nothing settled yet.</td></tr>';})()+
   '</tbody></table></div></div>';
}
function adPerms(){
  const roles=['care','agent','pandit','admin'];
  const paths=Object.keys(PERMS);
  const cls=v=>v==='edit'?'y':(v==='read'||v==='masked'||v==='call'||v==='flow')?'p':'n';
  return '<h1 class="h-page">Roles & permissions</h1>'+
   trig(['This matrix is the single source for who may change what. The UI reads it, and Supabase RLS plus a column trigger must enforce the same list server-side.',
         'A field marked <b>Locked</b> is visible but not editable. <b>Not visible</b> means the column is never sent to that client at all.',
         'Add a row here and both the UI and the policy follow — that is the point of keeping it as data.'])+
   '<div class="card" style="margin-top:12px;padding:6px"><div class="scroll-x"><table class="t mx"><thead><tr><th>Field</th>'+
   roles.map(r=>'<th style="text-align:center">'+esc(ROLES[r].label)+'</th>').join('')+'</tr></thead><tbody>'+
   paths.map(p=>'<tr><td>'+code(p)+'</td>'+roles.map(r=>{const v=can(r,p);
     return '<td class="'+cls(v)+'">'+esc(PERM_LABEL[v]||v)+'</td>';}).join('')+'</tr>').join('')+
   '</tbody></table></div></div>'+
   '<div class="legend" style="margin-top:10px"><span><span class="sw" style="background:var(--ok)"></span>Can edit</span>'+
   '<span><span class="sw" style="background:var(--warn)"></span>Visible, restricted</span>'+
   '<span><span class="sw" style="background:var(--ink-3)"></span>Not visible</span></div>'+
   '<h3 class="h-sec" style="margin:20px 0 10px">Why each field is restricted</h3>'+
   '<div class="card"><dl style="margin:0">'+paths.map(p=>kv(code(p),'<span style="font-weight:400">'+esc(permWhy(p))+'</span>')).join('')+'</dl></div>'+
   '<h3 class="h-sec" style="margin:20px 0 10px">Roles and how they log in</h3>'+
   '<div class="card" style="padding:6px"><div class="scroll-x"><table class="t"><thead><tr><th>Role</th><th>Surface</th><th>Authentication</th></tr></thead><tbody>'+
   Object.keys(ROLES).map(k=>'<tr><td style="font-weight:600">'+esc(ROLES[k].label)+'</td><td class="sub">'+esc(ROLES[k].surface)+'</td><td class="sub">'+esc(ROLES[k].auth)+'</td></tr>').join('')+
   '</tbody></table></div></div>';
}

function saveDemo(){

    if(!data||!Array.isArray(data.DB&&data.DB.bookings)||!Array.isArray(data.AGENTS)||!Array.isArray(data.CARE_USERS)||!Array.isArray(data.ADMIN_USERS)) return;
    SIM=data.SIM;SEQ=data.SEQ;DB=data.DB;TEMPLES=data.TEMPLES;PUJAS=data.PUJAS;
    AGENTS=data.AGENTS;PANDITS=data.PANDITS;CARE_USERS=data.CARE_USERS;ADMIN_USERS=data.ADMIN_USERS;BLACKOUTS=data.BLACKOUTS;
  }catch(e){}

function render(){
  document.getElementById('roles').innerHTML='';
  document.getElementById('app').innerHTML=(SCREENS[S.role]||flowScreen)();
  document.getElementById('clock').textContent='Simulated: '+fmtDate(SIM)+', '+fmtTime(SIM);
  document.getElementById('evcount').textContent=visibleEvents().length;
  const show=MOBILE_ROLES.includes(S.role);
  const dt=document.getElementById('devtoggle'); dt.hidden=!show;
  dt.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.v===S.device)));
  document.body.classList.toggle('mobile-preview',show&&S.device==='mobile');
  document.body.classList.toggle('modal-open',!!S.modal||!!S.templeLogin);
  document.body.classList.toggle('app-wallpaper',['user','agent','pandit'].includes(S.role)||(S.role==='cc'&&!!S.careUser));
  document.body.classList.toggle('role-wide',S.role==='agent'||S.role==='pandit');
  renderEvents();
  saveDemo();
  window.scrollTo({top:0,behavior:'instant'});
}
/* Masks a devotee's real name out of a free-text event string, for a customer care
   viewer — the events feed is global chrome, visible on every screen including CC's. */
function maskEventText(text,bookingId){
  if(!isCareMasked()||!bookingId) return text;
  const b=bk(bookingId); if(!b||!b.devotee.name) return text;
  return text.split(b.devotee.name).join(maskName(b.devotee.name));
}
/* a temple's customer care only sees activity for that temple's own bookings */
function visibleEvents(){
  const t=ccTempleId(), z=(S.role==='admin')?adminState():null;
  if(!t&&!z) return DB.events;
  return DB.events.filter(e=>{ const b=e.bookingId?bk(e.bookingId):null;
    return b&&(t?b.templeId===t:(temple(b.templeId)||{}).state===z); });
}
function renderEvents(){
  const evs=visibleEvents();
  document.getElementById('evlist').innerHTML=evs.length?evs.map(e=>{
    const c=CH[e.channel]||CH.System;
    return '<div class="ev"><div class="ev-i" style="background:'+c.bg+';color:'+c.fg+'">'+c.t+'</div><div class="ev-b">'+
     '<div class="ev-t">'+esc(maskEventText(e.title,e.bookingId))+'</div><div class="ev-m">'+esc(maskEventText(e.body,e.bookingId))+'</div>'+
     '<div class="ev-w">'+esc(e.channel)+' · '+fmtDT(e.at)+(e.tpl?' · '+esc(e.tpl):'')+'</div></div></div>';
  }).join(''):'<div class="empty">Nothing yet. Book a puja and the messages appear here.</div>';
}
function goTo(path,id){
  const [r,s]=path.split('.');
  S.role=r; S.sub=s||DEFAULT_SUB[r];
  if(id!==undefined&&id!==null&&id!=='') S.id=id;
  S.open=null; S.modal=null; render();
}
const val=id=>{const e=document.getElementById(id);return e?String(e.value).trim():'';};
const numv=(id,d)=>{const n=Number(val(id));return isFinite(n)&&val(id)!==''?n:d;};
function toast(msg,kind){
  const el=document.getElementById('app');
  el.insertAdjacentHTML('afterbegin','<div class="'+(kind==='stop'?'stopbox':'okbox')+'" style="margin:0 0 14px"><h4>'+esc(msg)+'</h4></div>');
  window.scrollTo({top:0,behavior:'instant'});
}
function tsFrom(dateId,timeId,fallback){
  const d=val(dateId), t=val(timeId)||'09:00';
  if(!d) return fallback;
  const ts=new Date(d+'T'+t+':00').getTime();
  return isFinite(ts)?ts:fallback;
}


document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, id=el.dataset.id, v=el.dataset.v;
  const b=id?bk(id):null;
  switch(a){
    case 'role': S.role=v; S.sub=DEFAULT_SUB[v]; S.open=null; S.modal=null; render(); break;
    case 'go': goTo(el.dataset.go,id); break;
    case 'brand-home': goTo(S.role+'.'+DEFAULT_SUB[S.role]); break;
    case 'device': S.device=v; render(); break;
    case 'sim-day': advance(DAY); break;
    case 'reset':
      try{window.localStorage.removeItem(STORAGE_KEY);}catch(err){}
      seed(); tick(); render(); break;
    case 'drawer-open': document.getElementById('drawer').dataset.open='true'; break;
    case 'drawer-close': document.getElementById('drawer').dataset.open='false'; break;
    case 'fm-open': S.open=(S.open===Number(v)?null:Number(v)); render(); break;

    /* ---------- devotee ---------- */
    case 'start-book': S.draft={pujaId:id}; goTo('user.book'); break;
    case 'to-pay':
      S.draft.name=val('bn')||'Ankita Bora'; S.draft.gotra=val('bg')||'Kashyap';
      S.draft.phone=val('bp')||'+91 90000 39999'; S.draft.city=val('bc')||'Bengaluru';
      S.draft.lang=val('blang')||'English'; S.draft.date=val('bd');
      goTo('user.payadv'); break;
    case 'go-back-book': goTo('user.book'); break;
    case 'pay-adv': {
      const p=puja(S.draft.pujaId);
      const at=S.draft.date?new Date(S.draft.date+'T09:00:00').getTime():SIM+p.lead*DAY;
      const bo=blackoutOn(p.templeId,at);
      if(bo){ goTo('user.book'); toast('That date is blacked out: '+bo.reason,'stop'); break; }
      const nb=mkBooking({pujaId:p.id,source:'Website',pujaAt:at,language:S.draft.lang||'English',
        devotee:{name:S.draft.name,gotra:S.draft.gotra,phone:S.draft.phone,email:'',city:S.draft.city,dob:'',pob:'',wish:''}});
      DB.bookings.unshift(nb);
      tlAdd(nb,'Booking created','Website · name and gotra captured');
      audit(nb,'status','Status','Draft','Advance paid','system');
      payAdvance(nb); S.id=nb.id; goTo('user.details',nb.id); break;
    }
    case 'save-details': {
      b.devotee.dob=val('dd'); b.devotee.pob=val('dp'); b.devotee.email=val('de'); b.devotee.wish=val('dw');
      const fam=val('dfam');
      b.sankalpaNames=fam?fam.split('\n').filter(Boolean).map(l=>{const p=l.split(',').map(s=>s.trim());
        return {name:p[0]||'',gotra:p[1]||b.devotee.gotra,rel:p[2]||'Family'};}):[];
      if(val('dpr')==='yes'){ b.prasad.opted=true; b.prasad.address=val('dpa'); b.prasad.status='pending dispatch'; }
      tlAdd(b,'Post-payment details captured','Date of birth, birthplace, wish'+(b.sankalpaNames.length?' and '+b.sankalpaNames.length+' family name(s)':''));
      goTo('user.success',b.id); break;
    }
    case 'open-paybal': goTo('user.paybal',id); break;
    case 'go-back-booking': goTo('user.booking',S.id); break;
    case 'pay-bal': payBalance(bk(S.id)); goTo('user.booking',S.id); break;
    case 'do-cancel': cancelBooking(b,val('cr')||'Other','care'); goTo('user.booking',b.id); break;
    case 'do-feedback':
      leaveFeedback(b,{overall:numv('fo',5),agentRating:numv('fa',5),panditRating:numv('fp',5),comment:val('fc')});
      goTo('user.booking',b.id); break;

    /* ---------- customer care ---------- */
    case 'cc-login': {
      const loginId=val('cli'), pw=val('clp'), st=val('clst');
      S.loginDraft=loginId; S.stateDraft=st;
      const fail=m=>{ S.loginError=m; S.pwDraft=''; S.pwShow=false; render(); };
      if(!st){ fail('Select your temple location first.'); break; }
      const wrong='Incorrect login ID or password for '+st+'.';
      const ad=ADMIN_USERS.find(x=>x.active&&x.loginId.toLowerCase()===loginId.trim().toLowerCase()&&x.password===pw);
      if(ad){
        if(ad.state!==st){ fail(wrong); break; }
        S.adminUser=ad.id; S.role='admin'; S.sub='careteam'; S.loginError=''; S.loginDraft=''; S.pwDraft=''; S.pwShow=false;
        render(); toast('Welcome, '+ad.name+'.'); break;
      }
      const u=CARE_USERS.find(x=>x.active&&x.loginId.toLowerCase()===loginId.trim().toLowerCase()&&x.password===pw);
      if(!u||(temple(u.templeId)||{}).state!==st){ fail(wrong); break; }
      S.careUser=u.id; S.fromAdmin=false;
      S.loginError=''; S.loginDraft=''; S.pwDraft=''; S.pwShow=false; S.sub='queue';
      render(); toast('Welcome back, '+u.name+'.'); break;
    }
    case 'cc-toggle-pw': S.loginDraft=val('cli'); S.pwDraft=val('clp'); S.stateDraft=val('clst'); S.pwShow=!S.pwShow; render(); break;
    case 'ad-open-cc': if((temple(v)||{}).state!==adminState()) break; S.templeLogin={templeId:v,error:'',idDraft:''}; render(); break;
    case 'ad-reveal-cred': S.revealCred[id]=!S.revealCred[id]; render(); break;
    case 'ad-temple-login-close': S.templeLogin=null; render(); break;
    case 'ad-temple-login': {
      const tl=S.templeLogin; if(!tl) break;
      const lid=val('tlid'), pwd=document.getElementById('tlpw')?document.getElementById('tlpw').value:'';
      const u=CARE_USERS.find(x=>x.active&&x.templeId===tl.templeId&&x.loginId.toLowerCase()===lid.trim().toLowerCase()&&x.password===pwd);
      if(!u){ tl.error='Incorrect login ID or password for '+temple(tl.templeId).name+'.'; tl.idDraft=lid; render(); break; }
      S.templeLogin=null; S.careUser=u.id; S.fromAdmin=true; S.role='cc'; S.sub='queue'; S.modal=null; render(); break;
    }
    case 'cc-back-admin': S.careUser=null; S.fromAdmin=false; S.role='admin'; S.sub='careteam'; S.modal=null; render(); break;
    case 'ad-logout': S.revealCred={}; S.adminUser=null; S.careUser=null; S.fromAdmin=false; S.templeLogin=null; S.role='cc'; S.sub='queue'; render(); break;
    case 'cc-logout': S.careUser=null; S.fromAdmin=false; S.sub='queue'; render(); break;
    case 'cc-temple':
      S.templeFrom=id||null; S.templeId=v;
      S.modal={type:'temple',templeId:v,bookingId:id||null}; render(); break;
    case 'cc-agent-view':
      S.templeFrom=id||S.templeFrom||null;
      S.templeId=el.dataset.temple||(b?b.templeId:S.templeId);
      S.modal={type:'agent',templeId:S.templeId,agentId:v,bookingId:S.templeFrom}; render(); break;
    case 'cc-modal-back':
      S.modal={type:'temple',templeId:S.templeId,bookingId:S.templeFrom}; render(); break;
    case 'cc-modal-close': S.modal=null; render(); break;
    case 'cc-auto-assign-start': startAutoAssign(); break;
    case 'cc-auto-assign-toggle': if(S.autoAssign){ S.autoAssign.minimized=!S.autoAssign.minimized; render(); } break;
    case 'cc-auto-assign-close': S.autoAssign=null; render(); break;
    case 'cc-unassign':
      if(!careUnassignmentOpen(b)){toast('This agent assignment cannot be changed now.','stop');break;}
      S.templeFrom=b.id; S.templeId=b.templeId;
      S.modal={type:'unassign',bookingId:b.id,templeId:b.templeId}; render(); break;
    case 'cc-unassign-no':
      S.modal={type:'temple',templeId:S.templeId,bookingId:S.templeFrom}; render(); break;
    case 'cc-unassign-yes':
      if(!unassignAgent(b,'care')){toast('This agent assignment cannot be changed now.','stop');break;}
      S.modal={type:'temple',templeId:b.templeId,bookingId:b.id,
        notice:'Agent and linked pandit unassigned. Choose another available agent below.'};
      render(); break;
    case 'cc-edit':
      S.modal={type:'edit',bookingId:id}; render(); break;
    case 'cc-edit-save': {
      if(!val('edit-date')||!val('edit-time')){
        document.getElementById('edit-error').innerHTML='<div class="stopbox" style="margin-top:12px"><h4>Choose a pooja date and time.</h4></div>'; break;
      }
      const result=applyCareEdit(b,{templeId:val('edit-temple'),pujaId:val('edit-puja'),
        pujaAt:tsFrom('edit-date','edit-time',NaN),agentId:val('edit-agent'),
        city:val('edit-city'),email:val('edit-email'),language:val('edit-language'),
        wish:val('edit-wish'),reason:val('edit-reason')});
      if(result.error){document.getElementById('edit-error').innerHTML='<div class="stopbox" style="margin-top:12px"><h4>'+esc(result.error)+'</h4></div>';break;}
      S.modal=null;render();
      toast(result.changed?'Booking updated across the portal.'+(result.packageChanged?(result.creditDue?' Credit to review: '+INR(result.creditDue)+'.':result.balanceDue?' Balance now due: '+INR(result.balanceDue)+'.':''):''):'No booking details changed.');
      break;
    }
    case 'cc-temple-assign': {
      if(!careAssignmentOpen(b)||!agent(v)||!agent(v).temples.includes(b.templeId)){
        toast('This booking cannot be reassigned at this stage.','stop'); break;
      }
      const moved=b.escalated?reassignAgent(b,v,'care'):assignAgent(b,v,'care');
      if(moved){S.modal={type:'temple',templeId:b.templeId,bookingId:b.id,
        notice:'Assigned '+agent(v).name+' ('+v+') to '+b.id+'. The agent can now choose a pandit from their team.'};render();}
      else toast('That agent is unavailable for this pooja time.','stop');
      break;
    }
    case 'cc-ai-note': S.noteDraft=aiNote(b); render(); toast('AI draft written into the note field. Edit it before saving.'); break;
    case 'cc-confirm': {
      const since=SIM, np=val('ccp');
      const newTs=tsFrom('ccd','cct',b.pujaAt);
      const proposedPuja=puja(np||b.pujaId);
      const bo=blackoutOn(b.templeId,newTs);
      if(bo){ toast('That date is blacked out: '+bo.reason,'stop'); break; }
      if(newTs<SIM+proposedPuja.lead*DAY){ toast('This pooja needs at least '+proposedPuja.lead+' days of lead time.','stop'); break; }
      const na=val('cca');
      if(MODES[b.mode].needsAgent&&!na){ toast('Choose an available agent for this temple and time.','stop'); break; }
      if(na&&!agentAvailability(b,agent(na),newTs).free){ toast('That agent is unavailable for the selected pooja time.','stop'); break; }
      if(np&&np!==b.pujaId){
        const p2=puja(np), old=puja(b.pujaId).name, oldAmount=b.amount;
        b.pujaId=np; b.amount=p2.price;
        b.advanceAmt=b.payments.filter(x=>x.kind==='advance'&&x.status==='captured').reduce((sum,x)=>sum+x.amount,0);
        b.balanceAmt=Math.max(0,b.amount-b.advanceAmt);
        audit(b,'pujaId','Puja',old,p2.name+' · '+INR(p2.price),'care','Changed during the confirmation call');
        audit(b,'amount','Package price',INR(oldAmount),INR(b.amount),'care','Changed during the confirmation call');
      }
      setField(b,'pujaAt','Puja date & time',newTs,'care',fmtDT);
      setField(b,'language','Language',val('cclang')||b.language,'care');
      setField(b,'devotee.email','Email',val('ccem'),'care');
      setField(b,'devotee.wish','Wish',val('ccw'),'care');
      if(na&&na!==b.agentId) assignAgent(b,na,'care');
      b.ccConfirmed=true; b.ccAt=SIM; b.status='CC_CONFIRMED';
      const auto=autoNote(b,since), typed=val('ccn');
      b.callLog.push({at:SIM,by:ACTOR.care,channel:'outbound',note:(typed||S.noteDraft||auto),auto:!typed&&!S.noteDraft});
      if(typed&&auto!=='Call made. No changes to the booking.') b.callLog.push({at:SIM,by:'System',channel:'outbound',note:auto,auto:true});
      S.noteDraft='';
      tlAdd(b,'Care call completed','Date, time and puja confirmed'+(b.agentId?' · agent '+agent(b.agentId).name:''));
      ev('Call','Confirmation call logged — '+b.id,typed||auto,b.id);
      render(); toast('Call logged. '+(b.agentId?'Agent assigned. ':'')+'Next: send the balance link.'); break;
    }
    case 'cc-save': {
      const since=SIM, reason=val('ccr');
      const newTs=tsFrom('ccd','cct',b.pujaAt);
      const bo=blackoutOn(b.templeId,newTs);
      if(bo){ toast('That date is blacked out: '+bo.reason,'stop'); break; }
      if(newTs!==b.pujaAt&&newTs<SIM+puja(b.pujaId).lead*DAY){ toast('This pooja needs at least '+puja(b.pujaId).lead+' days of lead time.','stop'); break; }
      const na=val('cca'), chosen=na||b.agentId;
      if(MODES[b.mode].needsAgent&&(!chosen||!agentAvailability(b,agent(chosen),newTs).free)){
        toast('Choose an available agent for this temple and time.','stop'); break;
      }
      if(newTs!==b.pujaAt) reschedule(b,newTs,'care',reason);
      setField(b,'language','Language',val('cclang')||b.language,'care',null,reason);
      setField(b,'devotee.email','Email',val('ccem'),'care',null,reason);
      setField(b,'devotee.wish','Wish',val('ccw'),'care',null,reason);
      if(na&&na!==b.agentId) assignAgent(b,na,'care');
      const auto=autoNote(b,since);
      if(auto!=='Call made. No changes to the booking.'){
        b.callLog.push({at:SIM,by:ACTOR.care,channel:'outbound',note:auto+(reason?' Reason given: '+reason+'.':''),auto:true});
      }
      render(); toast('Changes saved and written to the audit trail.'); break;
    }
    case 'cc-link': {
      sendLink(b,'care'); render();
      window.open(whatsappUrl(b.devotee.phone,'Balance due for '+puja(b.pujaId).name+': '+INR(b.balanceAmt)+'. Pay here: pay.namonamaha.in/'+b.id),'_blank','noopener');
      toast('Payment link sent on WhatsApp.'); break;
    }
    case 'cc-send-otp': {
      if(!sendOtpNow(b,'care')){ toast('This booking is not eligible for a completion code right now.','stop'); break; }
      render();
      window.open(whatsappUrl(b.devotee.phone,otpMsg(b)),'_blank','noopener');
      toast('Completion code sent on WhatsApp.'); break;
    }
    case 'cc-note':
      b.callLog.push({at:SIM,by:ACTOR.care,channel:'outbound',note:'Follow-up call about the outstanding balance of '+INR(b.balanceAmt)+'.',auto:false});
      ev('Call','Follow-up call logged — '+b.id,'Chased the outstanding balance of '+INR(b.balanceAmt)+'.',b.id);
      render(); break;
    case 'cc-reassign':
      if(reassignAgent(b,v,'care')){ render(); toast('Reassigned to '+agent(v).name+'. The 24-hour clock restarts.'); }
      else toast('That agent is unavailable for this temple and time.','stop');
      break;
    case 'cc-override': {
      const free=panditsFor(b,b.agentId).filter(x=>x.free);
      if(!free.length){ toast('No pandit is free for that slot. Reschedule or reassign the agent.','stop'); break; }
      assignPandit(b,free[0].d.id,'care'); render(); toast('Pandit assigned by care, overriding the agent.'); break;
    }
    case 'cc-pandit':
      if(assignPandit(b,v,'care')){ render(); toast('Pandit assigned. Both references were sent with the booking details.'); }
      else toast('That pandit is unavailable for this pooja.','stop');
      break;

    /* ---------- agent ---------- */
    case 'ag-start':
      if(startPuja(b,'agent')){render();toast('Pooja marked as running. Customer care now sees the green indicator.');}
      else toast('This pooja is not ready to start.','stop');
      break;
    case 'ag-assign':
      if(assignPandit(b,v,'agent')){ render(); toast('Pandit assigned. Customer care and the pandit now see both booking references.'); }
      else toast('That pandit is unavailable or outside your temple team.','stop');
      break;
    case 'ag-escalate': escalate(b,val('agre')||'OTHER',val('agnote'),'agent'); render();
      toast('Bypassed to customer care. They can see it now.','stop'); break;
    case 'ag-absent': escalate(b,'PANDIT_ABSENT','Assigned pandit is absent. Needs a replacement or another agent.','agent');
      render(); toast('Marked absent and bypassed to care.','stop'); break;
    case 'ag-otp':
      if(verifyOtp(b,val('agotp'),'Agent — '+agent(b.agentId).name,'agent')){ render(); toast('Puja closed. Photographs are due within 6 hours.'); }
      else toast('That code does not match. Ask the devotee to read it again from their WhatsApp message.','stop');
      break;
    case 'ag-photos': addMedia(b,'agent'); render(); toast('Photographs uploaded and sent to the devotee.'); break;
    case 'ag-prasad': dispatchPrasad(b,'agent'); render(); toast('Prasad marked dispatched. Tracking sent to the devotee.'); break;

    /* ---------- pandit ---------- */
    case 'pd-start':
      if(startPuja(b,'pandit')){render();toast('Pooja marked as running. Customer care now sees the green indicator.');}
      else toast('This pooja is not ready to start.','stop');
      break;
    case 'pd-otp':
      if(verifyOtp(b,val('pdotp'),'Pandit — '+pandit(b.pandaId).name,'pandit')) render();
      else { const er=document.getElementById('pderr');
        if(er) er.innerHTML='<div class="stopbox" style="margin:10px 0 0"><h4>Code does not match</h4><p>Ask the devotee to read it again from their WhatsApp message. The puja stays open until a correct code is entered.</p></div>'; }
      break;
    case 'pd-leave': {
      const me=pandit(ME_PANDIT);
      me.leave=me.leave.includes('absent-today')?[]:['absent-today'];
      render(); toast(me.leave.length?'You are marked unavailable today. Agents will not see you in the picker.':'You are available again.');
      break;
    }

    /* ---------- admin ---------- */
    case 'tg-mode': { const t=temple(id); t.modes[v]=!t.modes[v]; render(); break; }
    case 'tg-live': { const t=temple(id); t.live=!t.live; render(); break; }
    case 'tg-puja-active': { const p=puja(id); p.active=!p.active; render(); break; }
    case 'tg-agent': { const ag=agent(id); ag.active=!ag.active; render(); break; }
    case 'tg-agent-temple': { const ag=agent(id);
      ag.temples=ag.temples.includes(v)?ag.temples.filter(x=>x!==v):ag.temples.concat(v); render(); break; }
    case 'tg-pandit': { const d=pandit(id); d.active=!d.active; render(); break; }
    case 'tg-pandit-leave': { const d=pandit(id);
      d.leave=d.leave.includes('absent-today')?[]:['absent-today']; render(); break; }
    case 'ad-save-cap': {
      const d=pandit(id); d.cap=numv('cap-'+id,d.cap);
      const ph=val('phone-'+id); if(ph) d.phone=ph;
      render(); toast('Saved. Every screen that shows '+d.name+' now uses this number.'); break;
    }
    case 'ad-save-agent-phone': {
      const ag=agent(id); const ph=val('phone-'+id);
      if(!ph){ toast('Enter a phone number first.','stop'); break; }
      ag.phone=ph; render(); toast('Saved. Every screen that shows '+ag.name+' now uses this number.'); break;
    }
    case 'dev-letter': S.devFilter.letter=(S.devFilter.letter===v?'':v); render(); break;
    case 'ad-devotees-csv': downloadDevoteesCsv(); break;
    case 'masked-call': toast('Connecting to '+esc(v)+' on a masked line — neither side sees the other’s real number. (Simulated)'); break;
    case 'tg-careuser': {
      const u=careUser(id); if(!u) break;
      u.active=!u.active;
      if(!u.active&&S.careUser===u.id) S.careUser=null;
      render(); toast(u.active?u.name+' can sign in again.':u.name+'’s login is deactivated.'); break;
    }
    case 'ad-save-careuser': {
      const u=careUser(id); if(!u||(temple(u.templeId)||{}).state!==adminState()) break;
      const newId=val('uid-'+id), newPw=val('upw-'+id);
      if(!newId||!newPw){ toast('Login ID and password cannot be empty.','stop'); break; }
      if(loginTaken(newId,id,null)){
        toast('That login ID is already in use.','stop'); break;
      }
      u.loginId=newId.trim(); u.password=newPw;
      const tsel=val('utp-'+id); if(tsel&&temple(tsel)&&temple(tsel).state===adminState()) u.templeId=tsel;
      S.revealCred[id]=false; render(); toast('Login details updated for '+u.name+'.'); break;
    }
    case 'ad-add-temple': {
      const name=val('atn'), city=val('atc'), st=adminState();
      if(!name||!city){ toast('Enter the temple name and city.','stop'); break; }
      if(TEMPLES.some(t=>t.state===st&&t.name.toLowerCase()===name.toLowerCase())){ toast('That temple already exists in '+st+'.','stop'); break; }
      const n=Math.max(0,...TEMPLES.map(t=>Number(String(t.id).slice(1))||0))+1;
      TEMPLES.push({id:'T'+n,name,city,state:st,live:false,hours:'Onboarding',meet:'—',modes:{in_person:true,subscription:false,online:false}});
      render(); toast(name+' added under '+st+'. Now create its customer care login.'); break;
    }
    case 'ad-add-careuser': {
      const name=val('ucn'), loginId=val('ucl'), pw=val('ucp'), tid=val('uct');
      const t=temple(tid);
      if(!t||t.state!==adminState()){ toast('Choose a temple in your location.','stop'); break; }
      if(!name||!loginId||!pw){ toast('Fill in name, login ID and password.','stop'); break; }
      if(loginTaken(loginId,null,null)){ toast('That login ID is already in use.','stop'); break; }
      CARE_USERS.push({id:'U'+(CARE_USERS.length+1)+Math.random().toString(36).slice(2,5),name,loginId:loginId.trim(),password:pw,active:true,templeId:tid});
      render(); toast('Customer care login created for '+t.name+'.'); break;
    }
    case 'ad-save-admin': {
      const a=adminUser(S.adminUser); if(!a) break;
      const nid=val('aid'), npw=val('apw');
      if(!nid||!npw){ toast('Login ID and password cannot be empty.','stop'); break; }
      if(loginTaken(nid,null,a.id)){ toast('That login ID is already in use.','stop'); break; }
      a.loginId=nid.trim(); a.password=npw; S.revealCred.admin=false;
      render(); toast('Your admin login was updated.'); break;
    }
    case 'ad-add-payout': { const p=puja(id); p.payout.push({p:'helper',b:'fixed',v:1000}); render(); break; }
    case 'ad-del-payout': { const p=puja(id); p.payout.splice(Number(v),1); render(); break; }
    case 'ad-save-puja': {
      const p=puja(id);
      p.payout=p.payout.map((x,i)=>({p:val('po-p-'+i)||x.p,b:val('po-b-'+i)||x.b,v:numv('po-v-'+i,x.v)}));
      p.name=val('pjn')||p.name; p.templeId=val('pjt')||p.templeId; p.mode=val('pjm')||p.mode;
      p.dur=val('pjd')||p.dur; p.prep=val('pjpr')||p.prep; p.lead=numv('pjl',p.lead);
      p.price=numv('pjp',p.price); p.advancePct=numv('pjadv',DB.settings.advancePct); p.why=val('pjw')||p.why;
      if(p.mode==='subscription'){ p.cycle=val('pjc')||p.cycle||'weekly'; p.day=val('pjday')||p.day||'Every Monday'; }
      goTo('admin.pujas'); toast('Puja saved. The website updates immediately.'); break;
    }
    case 'ad-new-puja': {
      const np={id:'P'+(PUJAS.length+50),templeId:'T1',mode:'in_person',name:'New puja',dur:'1 hour',prep:'1 day',
        lead:3,price:10000,active:false,why:'Describe why a devotee should perform this puja.',
        payout:[{p:'pujari',b:'fixed',v:2000},{p:'samagri',b:'fixed',v:3000},{p:'agent',b:'percent',v:5}]};
      PUJAS.push(np); goTo('admin.pujaedit',np.id); toast('Draft created. It stays hidden until you switch it live.'); break;
    }
    case 'ad-add-blackout': {
      const t=val('bot')||'T1';
      BLACKOUTS.push({id:'B'+(BLACKOUTS.length+1),templeId:t,from:val('bof'),to:val('bot2')||val('bof'),
        reason:val('bor')||'Temple closed',blocks:true});
      render(); toast('Blackout added. New bookings on those dates are now blocked.'); break;
    }
    case 'ad-save-booking': {
      const reason=val('abr');
      if(!reason){ toast('A reason is required for an admin override.','stop'); break; }
      setField(b,'devotee.name','Devotee name',val('abn')||b.devotee.name,'admin',null,reason);
      setField(b,'devotee.phone','Mobile',val('abp')||b.devotee.phone,'admin',null,reason);
      setField(b,'devotee.gotra','Gotra',val('abg')||b.devotee.gotra,'admin',null,reason);
      setField(b,'devotee.email','Email',val('abe'),'admin',null,reason);
      setField(b,'devotee.city','City',val('abc'),'admin',null,reason);
      setField(b,'language','Language',val('abl')||b.language,'admin',null,reason);
      setField(b,'devotee.wish','Wish',val('abw'),'admin',null,reason);
      const np=val('abpj');
      if(np&&np!==b.pujaId){ const p2=puja(np);
        audit(b,'pujaId','Puja',puja(b.pujaId).name,p2.name,'admin',reason);
        b.pujaId=np; b.templeId=p2.templeId; b.mode=p2.mode; b.amount=p2.price; }
      setField(b,'amount','Amount',numv('abamt',b.amount),'admin',INR,reason);
      setField(b,'advancePct','Advance %',numv('abpct',b.advancePct),'admin',x=>x+'%',reason);
      b.advanceAmt=Math.round(b.amount*b.advancePct/100); b.balanceAmt=b.amount-b.advanceAmt;
      const newTs=tsFrom('abd','abt',b.pujaAt);
      setField(b,'pujaAt','Puja date & time',newTs,'admin',fmtDT,reason);
      const na=val('aba'); if(na!==(b.agentId||'')) setField(b,'agentId','Onsite agent',na||null,'admin',x=>x?agent(x).name:'—',reason);
      const nd=val('abpd'); if(nd!==(b.pandaId||'')) setField(b,'pandaId','Pandit',nd||null,'admin',x=>x?pandit(x).name:'—',reason);
      setField(b,'status','Status',val('abst')||b.status,'admin',x=>STATUS[x]?STATUS[x].label:x,reason);
      render(); toast('Saved. Every change is in the audit trail with your reason.'); break;
    }
    case 'ad-settle': {
      const p=puja(b.pujaId);
      const lines=payoutLines(p,b.amount).map((l,i)=>Object.assign({},l,{amount:numv('st-'+b.id+'-'+i,l.amount)}));
      settle(b,lines,'accounts'); render(); toast('Settlement recorded.'); break;
    }
    case 'set-pct': {
      DB.settings.advancePct=Number(v);
      DB.bookings.forEach(x=>{ if(!x.advancePaid){ x.advancePct=Number(v);
        x.advanceAmt=Math.round(x.amount*Number(v)/100); x.balanceAmt=x.amount-x.advanceAmt; }});
      ev('System','Advance percentage changed','Now '+v+'%. Every puja page and every unpaid booking updated immediately.');
      render(); break;
    }
    case 'set-gst': DB.settings.gstPct=numv('setgst',DB.settings.gstPct); render(); toast('GST rate saved.'); break;
  }
});
document.addEventListener('change',e=>{
  if(['edit-temple','edit-puja','edit-date','edit-time'].includes(e.target.id)){
    refreshEditModal(e.target.id); return;
  }
  if(e.target.id==='agent-view'){
    ME_AGENT=e.target.value; goTo('agent.list'); return;
  }
  if(e.target.id==='pandit-view'){
    ME_PANDIT=e.target.value; goTo('pandit.list'); return;
  }
  if((e.target.id==='ccd'||e.target.id==='cct')&&S.role==='cc'&&S.sub==='booking'){
    const b=bk(S.id), picker=document.getElementById('cca'), roster=document.getElementById('cc-agent-roster');
    if(!b||!picker||!roster) return;
    const selected=picker.value, ts=tsFrom('ccd','cct',b.pujaAt);
    picker.innerHTML=agentOptions(b,ts,selected);
    roster.innerHTML=agentRoster(b,ts);
  }
  if(['devtype','devpay','devfrom','devto'].includes(e.target.id)){
    S.devFilter.type=val('devtype')||'all'; S.devFilter.pay=val('devpay')||'all';
    S.devFilter.from=val('devfrom'); S.devFilter.to=val('devto');
    patchDevList();
  }
  if(e.target.id==='devexpfrom') S.devFilter.expFrom=e.target.value;
  if(e.target.id==='devexpto') S.devFilter.expTo=e.target.value;
});
document.addEventListener('input',e=>{
  if(e.target.id==='devq'){ S.devFilter.q=e.target.value; patchDevList(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id){
    const go={cli:'cc-login',clp:'cc-login',tlid:'ad-temple-login',tlpw:'ad-temple-login'}[e.target.id];
    if(go){ const b=document.querySelector('[data-act="'+go+'"]'); if(b) b.click(); return; }
  }
  if(e.key==='Escape'){
    if(S.templeLogin){S.templeLogin=null;render();}
    else if(S.modal){S.modal=null;render();}
    else document.getElementById('drawer').dataset.open='false';
  }
});

seed(); restoreDemo(); tick(); render();

</script>
